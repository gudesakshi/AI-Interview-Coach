<!DOCTYPE html>
<html>
<head>
    <title>Interview Feedback</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container mt-5">
    <h2>Interview Feedback</h2>
    <p><strong>Question:</strong> {{ question }}</p>
    <p><strong>Your Answer:</strong> {{ answer }}</p>

    <div class="feedback-box mt-3">
        <p><strong>Feedback:</strong> {{ feedback }}</p>
    </div>

    <p class="mt-3"><strong>Score:</strong> {{ score }}</p>

    {% if index + 1 < total %}
        <a href="/next" class="btn btn-primary mt-3">Next Question</a>
    {% else %}
        <a href="/next" class="btn btn-success mt-3">Finish Practice</a>
    {% endif %}
</div>
</body>
</html>
