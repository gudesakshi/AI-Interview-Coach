<!DOCTYPE html>
i<html>
<head>
    <title>AI Interview Coach</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container mt-5">

    <!-- Page Heading -->
    <h2 class="text-center mb-4">
        Interview Practice for {{ session['role']|capitalize }}
    </h2>
    <p class="text-center">Question {{ progress }} of {{ total }}</p>

    <!-- Progress Bar -->
    <div class="progress mb-3">
        <div class="progress-bar bg-primary" role="progressbar"
             style="width: {{ progress_percent }}%">
        </div>
    </div>

    <!-- Question Form -->
    <form action="/submit" method="post">
        <h4>{{ question }}</h4>
        <textarea name="answer" class="form-control mt-3" rows="5"
                  placeholder="Type your answer here..."></textarea>
        <button type="submit" class="btn btn-primary mt-3">Submit Answer</button>
    </form>

    <!-- Current Score -->
    <p class="mt-3"><strong>Current Score:</strong> {{ score }}</p>
</div>
</body>
</html>
