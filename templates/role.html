<!DOCTYPE html>
<html>
<head>
    <title>Select Job Role</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2 class="text-center mb-4">Choose Your Job Role</h2>

    <!-- Modern Card Layout -->
    <div class="row mb-5">
        <div class="col-md-4">
            <div class="card shadow">
                <div class="card-body text-center">
                    <h5 class="card-title">Software Engineer</h5>
                    <p class="card-text">Practice coding and debugging interview questions.</p>
                    <form method="post" action="/start">
                        <input type="hidden" name="role" value="software">
                        <button type="submit" class="btn btn-primary">Start Interview</button>
                    </form>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card shadow">
                <div class="card-body text-center">
                    <h5 class="card-title">Data Analyst</h5>
                    <p class="card-text">Practice SQL, data cleaning, and visualization questions.</p>
                    <form method="post" action="/start">
                        <input type="hidden" name="role" value="data">
                        <button type="submit" class="btn btn-success">Start Interview</button>
                    </form>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card shadow">
                <div class="card-body text-center">
                    <h5 class="card-title">Marketing Manager</h5>
                    <p class="card-text">Practice campaign strategy and product launch questions.</p>
                    <form method="post" action="/start">
                        <input type="hidden" name="role" value="marketing">
                        <button type="submit" class="btn btn-warning">Start Interview</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Original Dropdown (kept for fallback) -->
    <h4 class="text-center">Or use dropdown:</h4>
    <form action="/start" method="post" class="mt-3 text-center">
        <select name="role" class="form-select w-50 mx-auto">
            <option value="software">Software Engineer</option>
            <option value="data">Data Analyst</option>
            <option value="marketing">Marketing Manager</option>
        </select>
        <button type="submit" class="btn btn-secondary mt-3">Start Interview</button>
    </form>
</div>
</body>
</html>
