<!DOCTYPE html>
<html>
<head>
    <title>Final Results</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container mt-5 text-center">
    <h2>🎉 Congratulations!</h2>
    <p>You completed the interview practice for <strong>{{ role|capitalize }}</strong>!</p>
    <h3>Final Score: {{ score }} out of {{ total * 2 }}</h3>

    <div class="stars mt-3">
        {% for i in range(score//2) %}
            <span class="text-warning fs-3">★</span>
        {% endfor %}
        {% for i in range(total - score//2) %}
            <span class="text-secondary fs-3">☆</span>
        {% endfor %}
    </div>

    <p class="mt-4">Great job, you're interview‑ready!</p>
    <a href="/" class="btn btn-success mt-3">Restart Practice</a>
</div>
</body>
</html>
