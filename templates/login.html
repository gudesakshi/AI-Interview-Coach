<!DOCTYPE html>
<html>
<head>
  <title>Login</title>
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="d-flex justify-content-center align-items-center vh-100">

  <!-- Login Card -->
  <div class="card shadow p-4 text-center" style="width: 380px;">
    <!-- Logo -->
    <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo" height="60" class="mb-3">
    <h3 class="mb-4">AI Interview Coach</h3>

    <form method="post">
      <div class="mb-3">
        <input type="text" name="username" class="form-control" placeholder="Username" required>
      </div>
      <div class="mb-3">
        <input type="password" name="password" class="form-control" placeholder="Password" required>
      </div>
      <div class="form-check mb-3 text-start">
        <input class="form-check-input" type="checkbox" id="rememberMe">
        <label class="form-check-label" for="rememberMe">Remember me</label>
      </div>
      <button type="submit" class="btn btn-primary w-100">Login</button>
    </form>

    <p class="mt-3">Don’t have an account? <a href="/register">Register</a></p>
  </div>

</body>
</html>
